# Flags in Postgres. Spring Boot builds the DataSource, flagkit-spring builds a PostgresFlagStore
# from it. Connect as the environment's READER login: the application only reads flags.
#
# There is deliberately no spring.datasource.password. With no password set, the PostgreSQL JDBC
# driver reads it from the user's .pgpass file (or the file named by PGPASSFILE), so the secret
# never lands in a properties file or an environment variable.
spring.datasource.url=jdbc:postgresql://${FLAGKIT_HOST:localhost}:5432/${FLAGKIT_DB:flags}?sslmode=${FLAGKIT_SSLMODE:verify-full}
spring.datasource.username=${FLAGKIT_USER:orders_app}

# Which environment's tables to read: "prod_" and "staging_" are separate sets of tables.
flagkit.table-prefix=${FLAGKIT_PREFIX:}

# Load the graph at startup, so a bad graph (unknown condition, cycle, dangling prerequisite)
# stops the deployment instead of failing the first request.
flagkit.eager-load=true
